pretrained_model_name_or_path: xinlai/LISA-13B-llama2-v0-explanatory
name: lisa-13b-v0-exp

dataset_class: lisa_v0.utils.dataset.ValDataset
conv_type: vicuna_v1
lora_r: -1

# seg model keys
out_dim: 256
ce_loss_weight: 1.0
dice_loss_weight: 0.5
bce_loss_weight: 2.0
seg_token_idx: !!null
vision_tower: openai/clip-vit-large-patch14
use_mm_start_end: False
low_cpu_mem_usage: True
num_image_tokens: 256
precision: fp16
train_mask_decoder: True

# tokenizer keys
model_max_length: 512
padding_side: right
use_fast: False
cache_dir: !!null
legacy: True
